name: adjutant

services:
  tailscale:
    image: tailscale/tailscale:v1.102.3
    restart: unless-stopped
    env_file:
      - path: tailscale.env
        required: false
    environment:
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
      TS_SERVE_CONFIG: /config/${TAILSCALE_SERVE_CONFIG:-serve.json}
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      # TS_SERVE_CONFIG watches its containing directory for changes.
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      # iptables needs /run/xtables.lock; /var/run also resolves to /run in this image.
      - /run:rw,noexec,nosuid,size=4m,mode=0755
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:9002/healthz
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  source-sync:
    image: ${ADJUTANT_IMAGE:?ADJUTANT_IMAGE must be set in .env}
    # Reuse cached application images; fetch missing ones automatically.
    pull_policy: missing
    command:
      - /usr/local/bin/adjutant-source-sync
    init: true
    restart: unless-stopped
    environment:
      SOURCE_SYNC_ROOT: /workspace/repos
      SOURCE_SYNC_GITHUB_ORG: ${SOURCE_SYNC_GITHUB_ORG:-ShieldBattery}
      SOURCE_SYNC_INTERVAL_SECONDS: ${SOURCE_SYNC_INTERVAL_SECONDS:-900}
      SOURCE_SYNC_GIT_DEPTH: ${SOURCE_SYNC_GIT_DEPTH:-200}
      SOURCE_SYNC_RETENTION_SECONDS: ${SOURCE_SYNC_RETENTION_SECONDS:-7200}
      SOURCE_SYNC_JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-1800}
      SOURCE_SYNC_MAX_REPOSITORIES: ${SOURCE_SYNC_MAX_REPOSITORIES:-100}
      SOURCE_SYNC_MAX_REPOSITORY_KIB: ${SOURCE_SYNC_MAX_REPOSITORY_KIB:-1048576}
      SOURCE_SYNC_MAX_TOTAL_KIB: ${SOURCE_SYNC_MAX_TOTAL_KIB:-4194304}
    networks:
      - source-egress
    volumes:
      - source-repos:/workspace/repos
    read_only: true
    cap_drop:
      - ALL
    # Needed only by the image entrypoint for its one-way drop to UID/GID 10001.
    cap_add:
      - SETGID
      - SETUID
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/adjutant-source-sync
        - healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
      # Initial organization mirroring can take a while; a successful check ends this early.
      start_period: 30m

  adjutant-mcp:
    image: ${ADJUTANT_MCP_IMAGE:?ADJUTANT_MCP_IMAGE must be set in .env}
    pull_policy: missing
    init: true
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    env_file: mcp.env
    environment:
      # Both Codex and Tailscale Serve reach the MCP over the shared loopback interface.
      ADJUTANT_MCP_BIND: 127.0.0.1:8081
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8081/healthz
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  datadog-mcp-proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    init: true
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    env_file: datadog-mcp.env
    volumes:
      - ./config/datadog-mcp.Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    user: 10003:10003
    cap_drop:
      - ALL
    # The official Caddy binary carries this file capability. Retaining only that capability lets
    # the non-root process execute under no-new-privileges; the proxy itself binds high port 8082.
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 64
    tmpfs:
      - /config:rw,noexec,nosuid,size=4m,uid=10003,gid=10003,mode=0700
      - /data:rw,noexec,nosuid,size=4m,uid=10003,gid=10003,mode=0700
      - /tmp:rw,noexec,nosuid,size=4m,uid=10003,gid=10003,mode=0700
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -n "$$DATADOG_MCP_HOST" &&
          test -n "$$DATADOG_MCP_ACCESS_TOKEN" &&
          wget --quiet --spider http://127.0.0.1:8082/healthz
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s

  adjutant:
    image: ${ADJUTANT_IMAGE:?ADJUTANT_IMAGE must be set in .env}
    pull_policy: missing
    init: true
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
      adjutant-mcp:
        condition: service_healthy
      datadog-mcp-proxy:
        condition: service_healthy
      source-sync:
        condition: service_healthy
    env_file: adjutant.env
    environment:
      ADJUTANT_DATABASE_PATH: /var/lib/adjutant/data/adjutant.sqlite3
      # Serve reaches this over the shared loopback interface; port 8080 is not exposed directly.
      ADJUTANT_UI_BIND: 127.0.0.1:8080
      CODEX_HOME: /var/lib/adjutant/codex
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-1800}
      SHIELDBATTERY_SOURCE_DIR: /workspace/repos/current/ShieldBattery
    volumes:
      - adjutant-data:/var/lib/adjutant/data
      - codex-home:/var/lib/adjutant/codex
      # source-sync is the sole writer; Codex and the orchestrator receive immutable generations.
      - source-repos:/workspace/repos:ro
      # Keep tool policy reviewable while auth.json remains in the private named volume.
      - ./config/codex.toml:/var/lib/adjutant/codex/config.toml:ro
      # Shared diagnostic voice and delegation guidance, loaded from CODEX_HOME on each run.
      - type: bind
        source: ./config/AGENTS.md
        target: /var/lib/adjutant/codex/AGENTS.md
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    # Needed only by the setpriv entrypoint to drop from the root init shim to UID/GID 10001.
    cap_add:
      - SETGID
      - SETUID
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all(['http://127.0.0.1:8080/healthz','http://127.0.0.1:8081/healthz','http://127.0.0.1:8082/healthz','http://127.0.0.1:9002/healthz'].map(u=>fetch(u).then(r=>{if(!r.ok)throw Error(r.status)}))).then(()=>process.exit(0)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  adjutant-data:
  codex-home:
  source-repos:
  tailscale-state:

networks:
  # Keep the credential-free public updater off the service/Tailscale container network.
  source-egress:
