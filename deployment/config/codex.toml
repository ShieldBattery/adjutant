# Production Codex policy belongs in source control. Credentials belong in the codex-home volume
# or narrowly scoped environment variables, never in this file.

[mcp_servers.shieldbattery_database]
url = "http://127.0.0.1:8081/mcp"
enabled = true
required = true
enabled_tools = [
  "search_users",
  "get_user_diagnostics",
  "get_game_diagnostics",
  "database_schema",
  "query_database",
]
# Automatically use tools that retain their MCP read-only annotation; a future write-capable tool
# will require approval and therefore fail closed in the unattended runner.
default_tools_approval_mode = "writes"
startup_timeout_sec = 10
tool_timeout_sec = 15

# Datadog hosts the remote MCP. This loopback-only proxy owns its service-access token and fixes the
# upstream/toolset; Codex receives neither the token nor direct network access to Datadog.
[mcp_servers.datadog]
url = "http://127.0.0.1:8082/v1/mcp"
enabled = true
required = true
enabled_tools = [
  "search_datadog_logs",
  "analyze_datadog_logs",
  "search_datadog_spans",
  "get_datadog_trace",
  "search_datadog_metrics",
  "get_datadog_metric",
  "get_datadog_metric_context",
  "search_datadog_events",
  "search_datadog_monitors",
  "search_datadog_hosts",
  "search_datadog_services",
  "search_datadog_service_dependencies",
]
default_tools_approval_mode = "writes"
startup_timeout_sec = 15
tool_timeout_sec = 60
