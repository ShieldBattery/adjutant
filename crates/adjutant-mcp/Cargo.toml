[package]
name = "adjutant-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Read-only diagnostic MCP server for ShieldBattery"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
futures-util = "0.3.34"
rmcp = { version = "3.1.4", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlparser = { version = "0.62.0", features = ["visitor"] }
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7.18"
tower-http = { version = "0.7.0", default-features = false, features = ["limit"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
