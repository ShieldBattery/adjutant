[package]
name = "adjutant"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A Discord-attached diagnostic agent for ShieldBattery"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = "1.26.0"
zip = { version = "8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

